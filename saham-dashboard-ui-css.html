    <style>
        :root{
            --dark: rgb(36, 46, 53);
            --light: rgb(252, 252, 252);
            --primary: rgb(131, 181, 255);
            --success: rgb(14, 177, 14);
            --warning: rgb(211, 195, 54);
            --danger: rgb(243, 60, 60);
            --border: rgb(59, 73, 85);
        }

        body{
            font-family: "Poppins", arial;
            margin: 0;
            padding: 0;
        }




        /* MAIN CONTAINERS */

        .main-container{
            background-color: var(--dark);
            display: grid;
            height: 100vh;
            width: 100%;
            grid-template-rows: 1fr 2.5fr 4fr 2.5fr;  
            grid-template-columns: minmax(0, 1fr);
            gap: 10px;
            border-radius: 7px;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }





        /* RESULT CONTAINERS */

        .result-containers{
            grid-row: 1/2;
            grid-column: 1/2;
            column-gap: 10px;
            height: 100%;
            width: 100%;
            display: flex;
        }

        .result-box{
            width: 25%;
            height: 100%;
            border: 2px solid var(--border);
            border-radius: 5px;
            padding: 10px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: 1fr 1fr 5px;
        }

        .labels{
            grid-row: 1/2;
            grid-column: 1/2;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
        }

        .labels .l-label, .values .l-label{
            color: var(--success);
        }

        .labels .r-label, .values .r-label{
            color: var(--danger);
        }

        .values{
            grid-row: 2/3;
            grid-column: 1/2;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
        }

        .bars{
            grid-row: 3/4;
            grid-column: 1/2;
            width: 100%;
            min-width: 0;
            height: 100%;
            background-color: var(--danger);
            border-radius: 5px;
        }

        .bar-fill {
            height: 100%;
            width: 0%; /* Start dari 0 untuk animasi */
            background-color: #4CAF50; /* Warna default hijau */
            transition: width 1s ease-out;
            border-radius: 5px;
        }




        /* GRAPH CONTAINERS */

        .graph-containers{
            grid-row: 2/3;
            grid-column: 1/2;
            height: 100%;
            min-width: 0;
            width: 100%;
            display: flex;
            column-gap: 10px;
        }

        .graph-box{
            border: 2px solid var(--border);
            width: 25%;
            min-width: 0;
            height: 100%;
            border-radius: 5px;
            padding: 10px;
            box-sizing: border-box;
        }




        /* COUNTRY CONTAINERS */

        .country-containers{
            grid-row: 3/4;
            grid-column: 1/2;
            height: 100%;
            width: 100%;
            display: flex;
            column-gap: 10px;
        }

        .outer-box{
            width: 33%;
            /* height:100%; */
        }

        .country-head{
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 2fr;
            column-gap: 10px;
            font-size: 0.7rem;
            padding: 0 10px 0 10px;
            box-sizing: border-box;
        }

        .country-head label{
            color: var(--light);
        }

        .country-box{
            width: 100%;
            /* height: 100%; */
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid var(--border);
            border-radius: 5px;
        }

        .grid-table{
            display: grid;
            overflow-y: auto;
            grid-template-columns: 1fr 1fr 1fr 1fr 2fr;
            font-size: 0.7rem;
            color: var(--light);
            column-gap: 10px;
        }

        .tk, .sg{
            color: var(--primary);
            text-align: left;
        }

        .ls, .vl{
            color: var(--light);
            text-align: right;
        }

        .ch{
            color: var(--success);
            text-align: right;
        }

        .proportion-box{
            display: grid;
            grid-auto-flow: dense;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 5px;
        }

        .a{
            grid-column: span 2;
            grid-row: span 2;
            background-color: green;
            padding: 5px;
            box-sizing: border-box;
        }

        .b{
            grid-column: span 3;
            grid-row: span 1;
            background-color: rgb(8, 150, 8)
        }

        .c{
            grid-column: span 5;
            grid-row: span 2;
            background-color: rgb(44, 196, 44)
        }
        
        .d{
            grid-column: span 3;
            grid-row: span 1;
            background-color: rgb(51, 146, 51)
        }

        .e{
           grid-column: span 4;
           grid-row: span 4;
           background-color: rgb(98, 185, 98)
        }

        .f{
            grid-column: span 3;
            grid-row: span 3;
            background-color: rgb(17, 128, 17)
        }

        .g{
            grid-column: span 2;
            grid-row: span 2;
            background-color: rgb(14, 148, 14)
        }

        .h{
            grid-column: span 1;
            grid-row: span 1;
            background-color: var(--success)
        }

        .proportion-box div{
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--light);

        }

        /* ACTION CONTAINERS */

        .action-containers{
            grid-row: 4/5;
            grid-column: 1/2;
            height: 100%;
            width: 100%;
            display: flex;
            column-gap: 10px;
        }

        .outer-action{
            width: 33%;
        }

        .header-action{
            display: grid;
            grid-template-columns: 2fr 1fr;
            font-size: 0.7rem;
            color: var(--light);
            padding: 0 10px;
            box-sizing: border-box;
        }

        .header-news{
            padding: 0;
            display: grid;
            column-gap: 10px;
            grid-template-columns: 1fr 1fr 1fr;
        }

        .header-news label{
            padding: 0 10px;
        }
        
        .action-box{
            width: 100%;
            border: 2px solid var(--border);
            border-radius: 5px;
            padding: 10px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 2fr 1fr;
            color: var(--primary);
            font-size: 0.7rem;
        }

        .ticker-box{
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }

        .signal-box{
            width: 100%;
            display: grid;
            grid-template-columns: auto 1fr;
        }

        .news-container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            width: 100%;
            column-gap: 10px;
            color: var(--primary);
            font-size: 0.7rem;
        }

        .news-box{
            border: 2px solid var(--border);
            border-radius: 7px;
            padding: 10px;
            display: grid;
            grid-template-columns: auto auto;
        }

        .change-value{
            color: var(--success);
            text-align: right;
        }

    <script>
        // 1. Buat fungsi pembuat grafik
        function buatGrafik(idElement, labelData, angkaData, warna) {
            new Chart(document.getElementById(idElement), {
                type: 'bar',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'],
                    datasets: [{
                        label: labelData,
                        data: angkaData,
                        backgroundColor: warna,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        // 2. Panggil fungsi untuk 4 canvas berbeda
        buatGrafik('myChart1', 'Chart 1', [11, 21, 22, 30, 20, 10, 13, 4, 18, 28], 'rgba(54, 162, 235, 1)');
        buatGrafik('myChart2', 'Chart 2', [51, 12, 23, 15, 45, 35, 21, 22, 30, 20], 'rgba(75, 192, 192, 1)');
        buatGrafik('myChart3', 'Chart 3', [12, 2, 22, 43, 25, 35, 12, 23, 15, 45], 'rgba(255, 206, 86, 1)');
        buatGrafik('myChart4', 'Chart 4', [8, 13, 4, 18, 28, 11, 2, 22, 43, 25], 'rgba(153, 102, 255, 1)');
    </script>


    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Ambil semua kotak hasil
            const boxes = document.querySelectorAll('.result-box');

            boxes.forEach(box => {
                // 1. Cari label nilai kiri di dalam box ini saja
                const valueLabel = box.querySelector('.values .l-label');
                const barFill = box.querySelector('.bar-fill');

                if (valueLabel && barFill) {
                    // 2. Ambil teks (misal "97.32%"), buang tanda % agar jadi angka
                    const percentage = valueLabel.innerText.replace('%', '').trim();

                    // 3. Terapkan ke lebar bar
                    // Gunakan setTimeout sedikit agar animasi transisi CSS terlihat saat page load
                    setTimeout(() => {
                        barFill.style.width = percentage + '%';
                    }, 100);
                }
            });
        });
    </script>
